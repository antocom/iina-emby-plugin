<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emby</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #121216; --surface: #1c1c22; --surface2: #26262e;
    --border: #2e2e38; --border-light: #3a3a46;
    --accent: #52b788; --accent2: #74c69d;
    --text: #e8e8ee; --text-secondary: #b0b0be; --muted: #6e6e82;
    --danger: #e07070;
    --radius: 10px; --radius-sm: 6px;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    font-size: 13px; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ──────────────────────────────────────────── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 14px 12px; flex-shrink: 0;
    background: linear-gradient(180deg, var(--surface2) 0%, var(--surface) 100%);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 16px; font-weight: 700; letter-spacing: -0.3px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  #btn-settings {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 4px; border-radius: var(--radius-sm);
    transition: color 0.15s, background 0.15s;
  }
  #btn-settings:hover { color: var(--text); background: var(--surface2); }

  /* ── Breadcrumb ──────────────────────────────────────── */
  #breadcrumb {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 14px; font-size: 11.5px; color: var(--muted);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    overflow-x: auto; white-space: nowrap; min-height: 32px;
    background: var(--bg);
  }
  #breadcrumb:empty { display: none; }
  .bc-item { cursor: pointer; color: var(--accent2); transition: opacity 0.12s; }
  .bc-item:hover { opacity: 0.7; }
  .bc-sep { color: var(--border-light); margin: 0 1px; }
  .bc-current { color: var(--text-secondary); font-weight: 500; }

  /* ── Content ─────────────────────────────────────────── */
  #content { flex: 1; overflow-y: auto; overflow-x: hidden; }
  #content::-webkit-scrollbar { width: 5px; }
  #content::-webkit-scrollbar-track { background: transparent; }
  #content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  #content::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

  /* ── Card Grid ───────────────────────────────────────── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 10px;
  }

  .item-card {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    border: 1px solid var(--border);
  }
  .item-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    border-color: var(--accent);
  }
  .item-card:active { transform: translateY(-1px); }

  /* ── Poster ──────────────────────────────────────────── */
  .card-poster {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    overflow: hidden;
    background: var(--surface);
  }
  .card-poster img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform 0.3s ease;
  }
  .item-card:hover .card-poster img { transform: scale(1.05); }
  .card-poster.no-img img { display: none; }

  .card-fallback {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    font-size: 32px;
    background: linear-gradient(145deg, var(--surface) 0%, var(--surface2) 50%, #2a2a3e 100%);
    color: var(--muted);
  }
  .card-poster.no-img .card-fallback { display: flex; }

  /* ── Info Overlay ────────────────────────────────────── */
  .card-info {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 28px 9px 9px;
    background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.5) 55%, transparent 100%);
  }
  .card-title {
    font-size: 11.5px; font-weight: 600; line-height: 1.35;
    color: #fff;
    display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    font-size: 10px; color: rgba(255,255,255,0.55);
    margin-top: 3px;
  }

  /* ── Play Overlay ────────────────────────────────────── */
  .card-play {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.75);
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.18s ease, transform 0.18s ease;
    box-shadow: 0 3px 12px rgba(82,183,136,0.45);
    pointer-events: none;
  }
  .item-card:hover .card-play {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* ── States ──────────────────────────────────────────── */
  .state-box {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; height: 240px;
    color: var(--muted); font-size: 12.5px; text-align: center; padding: 24px;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 2.5px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: var(--danger); }

  /* ── Settings Panel ──────────────────────────────────── */
  #settings-panel {
    display: none; flex-direction: column; gap: 14px;
    padding: 16px 14px; overflow-y: auto; flex: 1;
  }
  #settings-panel.open { display: flex; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: 11.5px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .field input {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); padding: 9px 11px;
    font-size: 12.5px; outline: none; transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); }
  .field .hint { font-size: 10.5px; color: var(--muted); }
  .btn-row { display: flex; gap: 8px; margin-top: 4px; }
  .btn-primary {
    background: var(--accent); color: #0f1f14;
    border: none; border-radius: var(--radius-sm); padding: 9px 16px;
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary {
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 16px; font-size: 12.5px; cursor: pointer;
    transition: background 0.15s;
  }
  .btn-secondary:hover { background: var(--surface); }
  .save-result { font-size: 12px; text-align: center; min-height: 16px; }
  .save-result.ok  { color: var(--accent); }
  .save-result.err { color: var(--danger); }
</style>
</head>
<body>

<header>
  <h1>Emby</h1>
  <button id="btn-settings" title="Impostazioni">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</header>

<div id="breadcrumb"></div>

<div id="content">
  <div class="state-box">
    <span>Configura il server Emby<br>nelle impostazioni ⚙️</span>
  </div>
</div>

<div id="settings-panel">
  <div class="field">
    <label>URL Server</label>
    <input id="inp-server" type="url" placeholder="http://192.168.1.10:8096" />
    <span class="hint">Indirizzo del tuo server Emby (con porta)</span>
  </div>
  <div class="field">
    <label>API Key</label>
    <input id="inp-apikey" type="password" placeholder="Chiave API Emby" />
    <span class="hint">Dashboard → Impostazioni avanzate → Chiavi API</span>
  </div>
  <div class="field">
    <label>User ID</label>
    <input id="inp-userid" type="text" placeholder="ID utente" />
    <span class="hint">Dashboard → Utenti → clicca utente → ID nell'URL</span>
  </div>
  <div class="btn-row">
    <button class="btn-primary" id="btn-save">Salva</button>
    <button class="btn-secondary" id="btn-cancel">Annulla</button>
  </div>
  <div id="save-result" class="save-result"></div>
</div>

<script>
// ── Config & Image URL ────────────────────────────────────────────────────────
let embyConfig = {};
let lastItems = null;

function getImageUrl(item, maxH) {
  if (!embyConfig.serverUrl || !embyConfig.apiKey) return "";
  if (!item || !item.ImageTags || !item.ImageTags.Primary) return "";
  const base = embyConfig.serverUrl.replace(/\/$/, "");
  return base + "/Items/" + item.Id + "/Images/Primary"
    + "?maxHeight=" + (maxH || 400)
    + "&tag=" + item.ImageTags.Primary
    + "&quality=90"
    + "&api_key=" + encodeURIComponent(embyConfig.apiKey);
}

// ── Navigation ────────────────────────────────────────────────────────────────
const nav = [];

function showLoading() {
  document.getElementById("content").innerHTML =
    '<div class="state-box"><div class="spinner"></div><span>Caricamento…</span></div>';
}
function showError(msg) {
  document.getElementById("content").innerHTML =
    `<div class="state-box error-msg"><span>⚠ ${msg}</span><br><small style="color:#6e6e82;margin-top:8px">v2.0.3</small></div>`;
}
function fmtDuration(ticks) {
  if (!ticks) return "";
  const s = Math.round(ticks / 1e7);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

const ICONS = {
  CollectionFolder: "📁", Folder: "📂",
  Movie: "🎬", Series: "📺",
  Season: "🗂️", Episode: "▶️",
};
function iconFor(type) { return ICONS[type] || "📄"; }
const PLAYABLE = new Set(["Movie", "Episode"]);
const FOLDER   = new Set(["CollectionFolder", "Folder", "Series", "Season"]);

// ── Breadcrumb ────────────────────────────────────────────────────────────────
function renderBreadcrumb() {
  const el = document.getElementById("breadcrumb");
  if (!nav.length) { el.innerHTML = ""; return; }
  const parts = [{ id: null, name: "Librerie" }, ...nav];
  el.innerHTML = parts.map((p, i) => {
    const last = i === parts.length - 1;
    const sep  = i < parts.length - 1 ? '<span class="bc-sep"> › </span>' : "";
    return last
      ? `<span class="bc-current">${p.name}</span>${sep}`
      : `<span class="bc-item" data-idx="${i}">${p.name}</span>${sep}`;
  }).join("");
  el.querySelectorAll(".bc-item").forEach(el => {
    el.addEventListener("click", () => {
      const idx = +el.dataset.idx;
      if (idx === 0) { nav.length = 0; loadLibraries(); }
      else { nav.splice(idx); loadItems(nav[nav.length - 1]); }
    });
  });
}

// ── Render Items ──────────────────────────────────────────────────────────────
function renderItems(items) {
  const content = document.getElementById("content");
  if (!items.length) {
    content.innerHTML = '<div class="state-box"><span>Nessun elemento</span></div>';
    return;
  }
  content.innerHTML = '<div class="card-grid">' + items.map(item => {
    const imgUrl = getImageUrl(item);
    const meta = [item.ProductionYear, fmtDuration(item.RunTimeTicks)].filter(Boolean).join(" · ");
    const emoji = iconFor(item.Type);
    const isPlayable = PLAYABLE.has(item.Type);
    const safeName = (item.Name || "").replace(/"/g, "&quot;");
    return `
      <div class="item-card" data-id="${item.Id}" data-name="${safeName}" data-type="${item.Type}">
        <div class="card-poster${imgUrl ? "" : " no-img"}">
          ${imgUrl ? `<img src="${imgUrl}" loading="lazy" alt="${safeName}" onerror="this.parentElement.classList.add('no-img')"/>` : ""}
          <div class="card-fallback">${emoji}</div>
        </div>
        <div class="card-info">
          <div class="card-title">${item.Name || ""}</div>
          ${meta ? `<div class="card-meta">${meta}</div>` : ""}
        </div>
        ${isPlayable ? '<div class="card-play"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg></div>' : ""}
      </div>`;
  }).join("") + "</div>";

  content.querySelectorAll(".item-card").forEach(card => {
    card.addEventListener("click", () => {
      const { id, name, type } = card.dataset;
      if (FOLDER.has(type)) {
        nav.push({ id, name, type });
        loadItems({ id, name, type });
      } else if (PLAYABLE.has(type)) {
        iina.postMessage("play", { itemId: id, title: name });
      }
    });
  });
}

// ── Loading ───────────────────────────────────────────────────────────────────
function loadLibraries() {
  nav.length = 0;
  renderBreadcrumb();
  showLoading();
  iina.postMessage("getLibraries", {});
}

function loadItems(node) {
  renderBreadcrumb();
  showLoading();
  if (node.type === "Series") {
    iina.postMessage("getItems", { parentId: node.id, itemType: "Season" });
  } else if (node.type === "Season") {
    const series = nav[nav.length - 2];
    iina.postMessage("getEpisodes", { seriesId: series?.id || node.id, seasonId: node.id });
  } else {
    iina.postMessage("getItems", { parentId: node.id, itemType: "" });
  }
}

// ── Messages from main.js ─────────────────────────────────────────────────────
iina.onMessage("libraries", data => { lastItems = data; renderItems(data); });
iina.onMessage("items",     data => { lastItems = data; renderItems(data); });
iina.onMessage("episodes",  data => { lastItems = data; renderItems(data); });
iina.onMessage("error",     data => showError(data.message));
iina.onMessage("config",    data => {
  embyConfig = data;
  document.getElementById("inp-server").value = data.serverUrl || "";
  document.getElementById("inp-apikey").value = data.apiKey    || "";
  document.getElementById("inp-userid").value = data.userId    || "";
  if (lastItems) renderItems(lastItems);
});
iina.onMessage("configSaved", () => {
  const el = document.getElementById("save-result");
  el.textContent = "✓ Salvato"; el.className = "save-result ok";
  setTimeout(closeSettings, 900);
});

// ── Settings panel ────────────────────────────────────────────────────────────
function openSettings() {
  document.getElementById("settings-panel").classList.add("open");
  document.getElementById("content").style.display = "none";
  document.getElementById("breadcrumb").style.display = "none";
  document.getElementById("save-result").textContent = "";
  iina.postMessage("getConfig", {});
}
function closeSettings() {
  document.getElementById("settings-panel").classList.remove("open");
  document.getElementById("content").style.display = "";
  document.getElementById("breadcrumb").style.display = "";
}

document.getElementById("btn-settings").addEventListener("click", openSettings);
document.getElementById("btn-cancel").addEventListener("click", closeSettings);
document.getElementById("btn-save").addEventListener("click", () => {
  const serverUrl = document.getElementById("inp-server").value.trim();
  const apiKey    = document.getElementById("inp-apikey").value.trim();
  const userId    = document.getElementById("inp-userid").value.trim();
  const el        = document.getElementById("save-result");
  if (!serverUrl || !apiKey || !userId) {
    el.textContent = "⚠ Compila tutti i campi"; el.className = "save-result err";
    return;
  }
  iina.postMessage("saveConfig", { serverUrl, apiKey, userId });
});

// ── Startup ───────────────────────────────────────────────────────────────────
iina.postMessage("getConfig", {});
loadLibraries();
</script>
</body>
</html>
