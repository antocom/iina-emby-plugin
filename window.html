<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Emby Browser</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #121216; --surface: #1c1c22; --surface2: #26262e;
    --border: #2e2e38; --border-light: #3a3a46;
    --accent: #52b788; --accent2: #74c69d;
    --text: #e8e8ee; --text-secondary: #b0b0be; --muted: #6e6e82;
    --danger: #e07070;
    --radius: 10px; --radius-sm: 6px;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    font-size: 13px; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ──────────────────────────────────────────── */
  header {
    display: flex; align-items: center; justify-content: center;
    padding: 14px 14px 12px; flex-shrink: 0;
    background: linear-gradient(180deg, var(--surface2) 0%, var(--surface) 100%);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 16px; font-weight: 700; letter-spacing: -0.3px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  /* ── Breadcrumb ──────────────────────────────────────── */
  #breadcrumb {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 14px; font-size: 11.5px; color: var(--muted);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    overflow-x: auto; white-space: nowrap; min-height: 32px;
    background: var(--bg);
  }
  #breadcrumb:empty { display: none; }
  .bc-item { cursor: pointer; color: var(--accent2); transition: opacity 0.12s; }
  .bc-item:hover { opacity: 0.7; }
  .bc-sep { color: var(--border-light); margin: 0 1px; }
  .bc-current { color: var(--text-secondary); font-weight: 500; }

  /* ── Content ─────────────────────────────────────────── */
  #content { flex: 1; overflow-y: auto; overflow-x: hidden; }
  #content::-webkit-scrollbar { width: 5px; }
  #content::-webkit-scrollbar-track { background: transparent; }
  #content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  #content::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

  /* ── Card Grid ───────────────────────────────────────── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 12px;
  }

  .item-card {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    border: 1px solid var(--border);
  }
  .item-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    border-color: var(--accent);
  }
  .item-card:active { transform: translateY(-1px); }

  /* ── Poster ──────────────────────────────────────────── */
  .card-poster {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    overflow: hidden;
    background: var(--surface);
  }
  .card-poster img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform 0.3s ease;
  }
  .item-card:hover .card-poster img { transform: scale(1.05); }
  .card-poster.no-img img { display: none; }

  .card-fallback {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    font-size: 32px;
    background: linear-gradient(145deg, var(--surface) 0%, var(--surface2) 50%, #2a2a3e 100%);
    color: var(--muted);
  }
  .card-poster.no-img .card-fallback { display: flex; }

  /* ── Info Overlay ────────────────────────────────────── */
  .card-info {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 28px 9px 9px;
    background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.5) 55%, transparent 100%);
  }
  .card-title {
    font-size: 11.5px; font-weight: 600; line-height: 1.35;
    color: #fff;
    display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    font-size: 10px; color: rgba(255,255,255,0.55);
    margin-top: 3px;
  }

  /* ── Play Overlay ────────────────────────────────────── */
  .card-play {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.75);
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.18s ease, transform 0.18s ease;
    box-shadow: 0 3px 12px rgba(82,183,136,0.45);
    pointer-events: none;
  }
  .item-card:hover .card-play {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* ── States ──────────────────────────────────────────── */
  .state-box {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; height: 240px;
    color: var(--muted); font-size: 12.5px; text-align: center; padding: 24px;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 2.5px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: var(--danger); }
</style>
</head>
<body>
<header><h1>Emby Browser</h1></header>
<div id="breadcrumb"></div>
<div id="content">
  <div class="state-box"><div class="spinner"></div><span>Connessione…</span></div>
</div>

<script>
// ── Config & Image URL ────────────────────────────────────────────────────────
var embyConfig = {};

function getImageUrl(item, maxH) {
  if (!embyConfig.serverUrl || !embyConfig.apiKey) return "";
  if (!item || !item.ImageTags || !item.ImageTags.Primary) return "";
  var base = embyConfig.serverUrl.replace(/\/$/, "");
  return base + "/Items/" + item.Id + "/Images/Primary"
    + "?maxHeight=" + (maxH || 400)
    + "&tag=" + item.ImageTags.Primary
    + "&quality=90"
    + "&api_key=" + encodeURIComponent(embyConfig.apiKey);
}

// ── Navigation ────────────────────────────────────────────────────────────────
var nav = [];

function showLoading() {
  document.getElementById("content").innerHTML =
    '<div class="state-box"><div class="spinner"></div><span>Caricamento…</span></div>';
}
function showError(msg) {
  document.getElementById("content").innerHTML =
    '<div class="state-box error-msg"><span>⚠ ' + msg + '</span></div>';
}
function fmtDuration(ticks) {
  if (!ticks) return "";
  var s = Math.round(ticks / 1e7), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h > 0 ? h + "h " + m + "m" : m + "m";
}

var ICONS = {
  CollectionFolder: "📁", Folder: "📂",
  Movie: "🎬", Series: "📺",
  Season: "🗂️", Episode: "▶️",
};
function iconFor(type) { return ICONS[type] || "📄"; }
var PLAYABLE = ["Movie", "Episode"];
var FOLDER   = ["CollectionFolder", "Folder", "Series", "Season"];

// ── Breadcrumb ────────────────────────────────────────────────────────────────
function renderBreadcrumb() {
  var el = document.getElementById("breadcrumb");
  if (!nav.length) { el.innerHTML = ""; return; }
  var parts = [{id: null, name: "Librerie"}].concat(nav);
  el.innerHTML = parts.map(function(p, i) {
    var last = i === parts.length - 1;
    var sep  = i < parts.length - 1 ? '<span class="bc-sep"> › </span>' : "";
    return last
      ? '<span class="bc-current">' + p.name + '</span>' + sep
      : '<span class="bc-item" data-idx="' + i + '">' + p.name + '</span>' + sep;
  }).join("");
  el.querySelectorAll(".bc-item").forEach(function(el) {
    el.addEventListener("click", function() {
      var idx = +el.dataset.idx;
      if (idx === 0) { nav = []; loadLibraries(); }
      else { nav = nav.slice(0, idx); loadItems(nav[nav.length - 1]); }
    });
  });
}

// ── Render Items ──────────────────────────────────────────────────────────────
function renderItems(items) {
  var content = document.getElementById("content");
  if (!items.length) {
    content.innerHTML = '<div class="state-box"><span>Nessun elemento</span></div>';
    return;
  }
  content.innerHTML = '<div class="card-grid">' + items.map(function(item) {
    var imgUrl = getImageUrl(item);
    var meta = [item.ProductionYear, fmtDuration(item.RunTimeTicks)].filter(Boolean).join(" · ");
    var emoji = iconFor(item.Type);
    var isPlayable = PLAYABLE.indexOf(item.Type) >= 0;
    var safeName = (item.Name || "").replace(/"/g, "&quot;");
    return '<div class="item-card" data-id="' + item.Id + '" data-name="' + safeName + '" data-type="' + item.Type + '">'
      + '<div class="card-poster' + (imgUrl ? '' : ' no-img') + '">'
      + (imgUrl ? '<img src="' + imgUrl + '" loading="lazy" alt="' + safeName + '" onerror="this.parentElement.classList.add(\'no-img\')"/>' : '')
      + '<div class="card-fallback">' + emoji + '</div>'
      + '</div>'
      + '<div class="card-info">'
      + '<div class="card-title">' + (item.Name || '') + '</div>'
      + (meta ? '<div class="card-meta">' + meta + '</div>' : '')
      + '</div>'
      + (isPlayable ? '<div class="card-play"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg></div>' : '')
      + '</div>';
  }).join('') + '</div>';

  content.querySelectorAll(".item-card").forEach(function(card) {
    card.addEventListener("click", function() {
      var id = card.dataset.id, name = card.dataset.name, type = card.dataset.type;
      if (FOLDER.indexOf(type) >= 0) {
        nav.push({id: id, name: name, type: type});
        loadItems({id: id, name: name, type: type});
      } else if (PLAYABLE.indexOf(type) >= 0) {
        iina.postMessage("play", {itemId: id, title: name});
      }
    });
  });
}

// ── Loading ───────────────────────────────────────────────────────────────────
function loadLibraries() {
  nav = []; renderBreadcrumb(); showLoading();
  iina.postMessage("getLibraries", {});
}

function loadItems(node) {
  renderBreadcrumb(); showLoading();
  if (node.type === "Series") {
    iina.postMessage("getItems", {parentId: node.id, itemType: "Season"});
  } else if (node.type === "Season") {
    var series = nav[nav.length - 2];
    iina.postMessage("getEpisodes", {seriesId: (series && series.id) || node.id, seasonId: node.id});
  } else {
    iina.postMessage("getItems", {parentId: node.id, itemType: ""});
  }
}

// ── Messages from global.js ──────────────────────────────────────────────────
iina.onMessage("config", function(data) {
  embyConfig = data;
  loadLibraries();
});

iina.onMessage("result", function(data) {
  renderItems(data.items || []);
});

iina.onMessage("error", function(data) {
  showError(data.message || "Errore sconosciuto");
});
</script>
</body>
</html>
